name: Secret scanning

# Two scanners, deliberately, because they fail in different directions:
#
#   gitleaks    pattern and entropy based. Broad recall, more false positives.
#   trufflehog  attempts to *verify* candidate credentials against the issuing provider, so a
#               "verified" result is a live secret rather than a guess.
#
# Both scan the full history, not the working tree. A credential that was committed and then
# deleted in a later commit is still in the history, still cloneable, and still compromised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not just the tip. Required for history scanning to mean anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for repositories owned by an organisation.
          # This one is personally owned, so it is intentionally absent.

  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --results=verified,unknown
