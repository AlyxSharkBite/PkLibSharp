name: CI

# The security workflows are only meaningful if the code actually builds, so this runs first
# and is the gate the others assume.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. No job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job's token sitting in .git/config where a later step could read it.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        # Locked mode fails the build if the committed packages.lock.json does not match the
        # projects' declared dependencies, so an unreviewed package cannot slip into CI.
        run: dotnet restore --locked-mode

      - name: Build
        # New warnings fail the build. The tree is warning free today, so this stays honest.
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        # No --nologo here: xunit v3 runs on Microsoft.Testing.Platform, whose dotnet test mode
        # rejects that VSTest-era option with exit code 5 (invalid arguments).
        run: dotnet test --configuration Release --no-build --verbosity normal
